name: Production Continuous Delivery

on:
  workflow_dispatch: # Manual trigger only

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production # Uses GitHub Environment protection/approvals if configured
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- 1. Apply Production Infrastructure ---
      - name: Terraform Apply (Production)
        run: |
          cd infra/environments/prod
          terraform init
          terraform apply -auto-approve
          
          # Extract Outputs
          EC2_IP=$(terraform output -raw prod_ec2_ip)
          CF_ID=$(terraform output -raw prod_cloudfront_id)
          PROD_URL=$(terraform output -raw prod_site_url)
          
          echo "PROD_EC2_IP=$EC2_IP" >> $GITHUB_ENV
          echo "PROD_CF_ID=$CF_ID" >> $GITHUB_ENV

          # Display URL in Pipeline Logs & Summary Dashboard
          echo "=================================================="
          echo "🚀 PRODUCTION URL: $PROD_URL"
          echo "=================================================="
          echo "### 🟢 Production Deployment Live!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** [$PROD_URL]($PROD_URL)" >> $GITHUB_STEP_SUMMARY

      # --- 2. Build & Deploy Prod Frontend (S3 + CloudFront) ---
      - name: Build & Deploy Frontend to Prod S3
        run: |
          cd frontend
          npm install
          npm run build
          aws s3 sync dist/ s3://kashan-my-app-frontend-prod --delete
          aws cloudfront create-invalidation --distribution-id ${{ env.PROD_CF_ID }} --paths "/*"

      # --- 3. Deploy Prod Backend (EC2) ---
      - name: Deploy Backend to Prod EC2
        uses: appleboy/ssh-action@v1.0.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          host: ${{ env.PROD_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.KEYFOREC2 }}
          envs: SLACK_WEBHOOK_URL
          script: |
            set -e
            echo "🚀 Deploying Backend to Production EC2..."
            
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              export DEBIAN_FRONTEND=noninteractive
  
              sudo apt-get update -y
              sudo NEEDRESTART_MODE=a apt-get install -y \
              -o Dpkg::Options::="--force-confdef" \
              -o Dpkg::Options::="--force-confold" \
              ca-certificates curl gnupg lsb-release
              
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo NEEDRESTART_MODE=a apt-get install -y \
              -o Dpkg::Options::="--force-confdef" \
              -o Dpkg::Options::="--force-confold" \
              docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # Ensure Loki Docker Plugin is installed host-wide
            if ! sudo docker plugin ls | grep -q loki; then
              echo "Installing Loki Docker Plugin..."
              sudo docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
            fi

            if [ ! -d "$HOME/app" ]; then
              git clone https://github.com/${{ github.repository }}.git $HOME/app
            fi

            cd $HOME/app
            git fetch --all
            git checkout main
            git pull origin main

            # Inject Slack Webhook into .env file for docker-compose
            echo "SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}" > .env

            sudo docker compose up -d --build --force-recreate
