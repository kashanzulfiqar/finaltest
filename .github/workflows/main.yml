name: Frontend CI/CD

on:
  push:
    branches: [ main1 ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Create Dynamic .env File
        run: |
          cat << 'EOF' > .env
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          NODE_ENV=production
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          EOF

      - name: Build frontend production bundle
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx webpack --mode production --progress

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://kashan-my-app-frontend-staging --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CF_ID }} --paths "/*"
